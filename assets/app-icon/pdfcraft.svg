<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Red Background Gradient -->
    <linearGradient id="pdfRedBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3843" />
      <stop offset="100%" stop-color="#BA121B" />
    </linearGradient>

    <!-- Craft Ribbon / Emblem Gradient -->
    <linearGradient id="craftRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52E38" />
      <stop offset="100%" stop-color="#990B13" />
    </linearGradient>

    <!-- Fold Flap Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>

    <!-- Main Drop Shadow -->
    <filter id="docShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5B0509" flood-opacity="0.35" />
    </filter>

    <!-- Internal Fold Shadow -->
    <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- App Icon Squircle Canvas -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#pdfRedBg)" />

  <!-- Subtle Top Rim Light -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />

  <!-- White PDF Document Card -->
  <g filter="url(#docShadow)">
    <!-- Base Page with Folded Top-Right Corner -->
    <path d="M 152 104
             H 312
             L 384 176
             V 388
             A 20 20 0 0 1 364 408
             H 148
             A 20 20 0 0 1 128 388
             V 128
             A 24 24 0 0 1 152 104 Z"
          fill="#FFFFFF" />

    <!-- Corner Fold Flap -->
    <path d="M 312 104
             L 384 176
             H 328
             A 16 16 0 0 1 312 160
             V 104 Z"
          fill="url(#foldGrad)"
          filter="url(#foldShadow)" />
  </g>

  <!-- PDFCraft Emblem (Stylized Folded 'P' + Craft Lines) -->
  <g transform="translate(172, 160)">
    <!-- Stem of 'P' -->
    <rect x="0" y="0" width="32" height="142" rx="8" fill="url(#craftRed)" />

    <!-- Loop of 'P' -->
    <path d="M 32 0
             H 80
             A 40 40 0 0 1 120 40
             A 40 40 0 0 1 80 80
             H 32
             V 0 Z"
          fill="url(#craftRed)" />

    <!-- Inner 'P' Hole -->
    <path d="M 32 24
             H 76
             A 16 16 0 0 1 92 40
             A 16 16 0 0 1 76 56
             H 32
             V 24 Z"
          fill="#FFFFFF" />

    <!-- Document Reading & Craft Accent Lines -->
    <rect x="48" y="98" width="120" height="12" rx="6" fill="#F3F4F6" />
    <rect x="48" y="120" width="90" height="12" rx="6" fill="#E5E7EB" />
    <rect x="0" y="156" width="168" height="10" rx="5" fill="#FF3843" opacity="0.85" />
  </g>
</svg>
