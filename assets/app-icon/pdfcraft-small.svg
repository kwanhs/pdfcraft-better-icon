<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="t"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a54"/>
      <stop offset="1" stop-color="#c21824"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d92230"/>
      <stop offset="1" stop-color="#9e121c"/>
    </linearGradient>
    <linearGradient id="fold" x1="0.15" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#c4c9d2"/>
    </linearGradient>
    <filter id="pageShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#6a0d14" flood-opacity="0.42"/>
    </filter>
  </defs>
  <g clip-path="url(#t)">
    <rect width="512" height="512" fill="url(#field)"/>

    <!-- page: rounded rect, fold sits on the top-right corner -->
    <g filter="url(#pageShadow)">
      <rect x="118" y="92" width="282" height="364" rx="44" fill="#ffffff"/>
    </g>
    <path fill="url(#fold)" d="M 318 92 L 400 174 H 318 Z"/>
    <path fill="#ffffff" opacity="0.28" d="M 318 92 L 352 126 L 318 126 Z"/>

    <!-- P: vertical bar, bowl only on the upper part so the stem hangs below -->
    <rect x="156" y="148" width="54" height="172" rx="14" fill="url(#letter)"/>
    <path fill="url(#letter)" fill-rule="evenodd" d="
      M 192 148
      H 240
      A 54 54 0 0 1 240 256
      H 192
      Z
      M 210 176
      H 236
      A 32 32 0 0 1 236 228
      H 210
      Z"/>

    <rect x="156" y="340" width="176" height="13" rx="6.5" fill="#e3e6eb"/>
    <rect x="156" y="364" width="176" height="13" rx="6.5" fill="#e3e6eb"/>
    <rect x="156" y="390" width="196" height="13" rx="6.5" fill="#e0313c"/>
  </g>
</svg>
