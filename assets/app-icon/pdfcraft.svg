<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="t"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a54"/>
      <stop offset="1" stop-color="#c21824"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d92230"/>
      <stop offset="1" stop-color="#9e121c"/>
    </linearGradient>
    <linearGradient id="fold" x1="0.15" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#c4c9d2"/>
    </linearGradient>
    <filter id="pageShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#6a0d14" flood-opacity="0.42"/>
    </filter>
  </defs>
  <g clip-path="url(#t)">
    <rect width="512" height="512" fill="url(#field)"/>

    <g filter="url(#pageShadow)">
      <path fill="#ffffff" d="
        M 118 92
        h 196
        L 400 178
        V 412
        a 44 44 0 0 1 -44 44
        H 162
        a 44 44 0 0 1 -44 -44
        Z"/>
    </g>

    <path fill="url(#fold)" d="M 314 92 L 400 178 H 314 Z"/>
    <path fill="#ffffff" opacity="0.28" d="M 314 92 L 348 126 L 314 126 Z"/>

    <!-- pill stem -->
    <rect x="156" y="148" width="58" height="176" rx="29" fill="url(#letter)"/>
    <!-- D bowl overlapping the stem -->
    <path fill="url(#letter)" fill-rule="evenodd" d="
      M 198 148
      H 238
      A 80 80 0 0 1 238 308
      H 198
      Z
      M 214 184
      H 234
      A 46 46 0 0 1 234 276
      H 214
      Z"/>

    <rect x="156" y="348" width="168" height="13" rx="6.5" fill="#e3e6eb"/>
    <rect x="156" y="372" width="168" height="13" rx="6.5" fill="#e3e6eb"/>
    <rect x="156" y="398" width="200" height="13" rx="6.5" fill="#e0313c"/>
  </g>
</svg>
